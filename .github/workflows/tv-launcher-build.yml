name: TV Launcher Debug Build

on:
  push:
    branches:
      - claude/tv-wallpaper-screensaver
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/tv-launcher-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x tv-launcher/gradlew

      - name: Build debug APK
        working-directory: tv-launcher
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-debug-apk
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
