name: TV Launcher Debug Build

on:
  push:
    branches:
      - claude/tv-wallpaper-screensaver
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/tv-launcher-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x tv-launcher/gradlew

      - name: Build debug APK
        working-directory: tv-launcher
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            encoded=$(tail -c 3000 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error::BUILD_LOG_TAIL::${encoded}"
            exit 1
          }

      - name: Post build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Log tail:"
            echo '```'
            tail -c 50000 tv-launcher/build.log
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@/tmp/comment.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-debug-apk
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
