# XcodeGen spec — generates App.xcodeproj from this file. Editing the
# generated .xcodeproj directly is a dead end (XcodeGen overwrites it), so
# every project setting lives here instead. See ios/README.md for the
# one-time "install xcodegen, run `xcodegen generate`" setup step this
# file needs (only possible on a Mac — this repo was scaffolded from a
# Linux sandbox with no Xcode available to generate/build it directly).
name: MnAlwahsh

options:
  bundleIdPrefix: com.mnalwahsh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settingGroups:
  shared:
    base:
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: App/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      MARKETING_VERSION: "1.1.0"
      CURRENT_PROJECT_VERSION: "1"
      # Placeholder — must match whatever bundle id you actually registered
      # in the Apple Developer portal / App Store Connect. See README.
      PRODUCT_BUNDLE_IDENTIFIER: com.mnalwahsh.ios
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
      ENABLE_PREVIEWS: NO

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "project.yml"
    settingGroups: [shared]
    settings:
      base:
        PRODUCT_NAME: "من الوحش"
        # iPhone + iPad (TARGETED_DEVICE_FAMILY "1,2" from the shared
        # settingGroup above). A prior change pinned this to "1" (iPhone
        # only) to dodge iPad review, but Apple still reviews iPhone-only
        # builds on iPad in compatibility/scaled mode (confirmed: the
        # 2026-10-05 rejection was tested on an "iPad Air 11-inch (M3)")
        # — so restricting the device family doesn't actually avoid iPad
        # review, it just makes the app render smaller/boxed there instead
        # of filling the screen. Since MainViewController's WKWebView is
        # pinned to view bounds with Auto Layout (fills whatever screen
        # it's given) and the site itself is already responsive (flex
        # layout, vw/dvh units, env(safe-area-inset-*), a user zoom
        # control), genuinely supporting iPad should render correctly
        # with no further native changes needed. No override here.
