plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.mnalwahsh.twa"
    compileSdk 36

    defaultConfig {
        applicationId "com.mnalwahsh.twa"
        minSdk 23
        targetSdk 36
        // Old TWA build was versionCode 5 / versionName 1.0.0.7. versionCode
        // 6 got consumed by an earlier Play Console upload attempt that was
        // rejected for missing requirements (API 36 / Billing Library 8),
        // so this ships as 7.
        versionCode 7
        versionName "1.0.0.9"
    }

    signingConfigs {
        if (hasKeystoreProperties) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.android.billingclient:billing-ktx:8.0.0"
}
